services:
  resonance:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elitk-resonance
    restart: unless-stopped
    expose:
      - "8080"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Caddy (or any reverse proxy on the same Docker network) handles TLS termination.
    # The service exposes port 8080 internally; the proxy maps 80/443 externally.
    networks:
      - caddy_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  caddy_net:
    external: true
    # Create before first deploy: docker network create caddy_net
