services:
  elitk-8:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    # All secrets are injected at runtime — never in the Dockerfile or image layers.
    # Copy .env.example → .env.production and populate all required keys before deploying.
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Caddy (or any reverse proxy on caddy_net) handles TLS termination.
    # Port 8080 is internal only; the proxy maps 80/443 externally.
    networks:
      - caddy_net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  caddy_net:
    external: true
    # Create once before first deploy: docker network create caddy_net
