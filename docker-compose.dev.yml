services:
  elitk-8-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: npm run dev
    ports:
      - "3000:3000"
      - "5173:5173"
    volumes:
      # Mount source for live reload — changes reflect without rebuilding the image
      - .:/app
      - /app/node_modules
    env_file:
      - .env.local
    environment:
      NODE_ENV: development
      PORT: "3000"
    networks:
      - dev_net

networks:
  dev_net:
    driver: bridge
