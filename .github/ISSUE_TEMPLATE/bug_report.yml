---
name: Bug Report
description: Report a reproducible bug
title: "[bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before submitting, please check if a similar issue already exists.

  - type: dropdown
    id: subsystem
    attributes:
      label: Subsystem
      options:
        - AI Pipeline & Gemini Integration
        - 3D Rendering & Particle Engine
        - Audio Engine & TTS
        - Face Tracking & MediaPipe
        - API Server & Middleware
        - Database & ORM Layer
        - CI/CD & DevOps
        - Other
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - P0 - Critical (system crash / data loss)
        - P1 - High (major functionality broken)
        - P2 - Medium (degraded behavior)
        - P3 - Low (cosmetic / minor)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Navigate to...
        2. Click on...
        3. Observe error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        OS: Windows 11 / macOS 15 / Ubuntu 24
        Browser: Chrome 128 / Firefox 130
        Node.js: 22.x
        Deployment: local dev / Docker / production

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Screenshots
      description: Paste browser console errors, server logs, or attach screenshots.
