---
name: Feature Request
description: Propose a new feature or enhancement
title: "[feat]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for submitting a feature request. Please fill out all sections as completely as possible.

  - type: dropdown
    id: subsystem
    attributes:
      label: Subsystem
      description: Which part of the system does this feature affect?
      options:
        - AI Pipeline & Gemini Integration
        - 3D Rendering & Particle Engine
        - Audio Engine & TTS
        - Face Tracking & MediaPipe
        - API Server & Middleware
        - Knowledge & Context Engine
        - CI/CD & DevOps
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0 - Critical (blocks production)
        - P1 - High (significant user impact)
        - P2 - Medium (improvement)
        - P3 - Low (nice to have)
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? Be specific.
      placeholder: "Currently, when a user does X, they cannot Y because..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the desired behavior and technical approach.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches did you evaluate?

  - type: checkboxes
    id: requirements
    attributes:
      label: Acceptance Criteria
      options:
        - label: I have searched for duplicate issues
          required: true
        - label: This feature aligns with the project's architectural principles
          required: true
        - label: I can contribute an implementation or test for this feature
